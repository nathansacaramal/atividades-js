<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th, td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        th{
            background:#007BFF;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }
    </style>
</head>
<body>

    <a href="home.html">voltar</a>

<h1>Lista de Produtos</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Data Cadastro</th>
        </tr>
    </thead>

    <tbody id="tabelaProdutos">

    </tbody>
</table>

<script>

fetch("/produtos")
.then(res => res.json())
.then(produtos => {

    const tabela = document.getElementById("tabelaProdutos");

    produtos.forEach(produto => {

        tabela.innerHTML += `
            <tr>
                <td>${produto.id_produto}</td>
                <td>${produto.nome_produto}</td>
                <td>${produto.id_categoria}</td>
                <td>${produto.preco}</td>
                <td>${produto.data_cadastro}</td>
            </tr>
        `;

    });

})
.catch(erro => {
    console.log(erro);
    alert("Erro ao carregar os produtos.");
});

</script>

</body>
</html>
