<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro</title>

    <!-- Bootstrap 5 -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">
            <div class="col-md-4">

                <div class="card shadow">
                    
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0" style="text-align: center;">Relatorio por especialista</h2>
                    </div>

                    <div class="card-body">

<form id="formulario" action="receber.php" method="POST">

    <div class="row align-items-end">

        <!-- Data início -->
        <div class="col-md-5">
            <label for="dt_inicio" class="form-label fw-bold">
                Data de Início
            </label>

            <input 
                type="date" 
                name="dt_inicio" 
                id="dt_inicio" 
                class="form-control">
        </div>

        <!-- Texto até -->
        <div class="col-md-2 text-center">
            <label class="form-label fw-bold invisible">até</label>
            <div class="fw-bold">até</div>
        </div>

        <!-- Data final -->
        <div class="col-md-5">
            <label for="dt_final" class="form-label fw-bold">
                Data fim
            </label>

            <input 
                type="date" 
                name="dt_final" 
                id="dt_final" 
                class="form-control">
        </div>

    </div>

    <!-- Checkboxes centralizados -->
    <div class="d-flex justify-content-center gap-5 mt-4">

        <div class="form-check">
            <input 
                type="checkbox" 
                class="form-check-input" 
                id="nominal">

            <label 
                for="nominal" 
                class="form-check-label fw-bold">
                Nominal
            </label>
        </div>

        <div class="form-check">
            <input 
                type="checkbox" 
                class="form-check-input" 
                id="quantitativo">

            <label 
                for="quantitativo" 
                class="form-check-label fw-bold">
                Quantitativo
            </label>
        </div>

    </div>

    <br>

    <div class="col-md-12">
        <label for="espec" class="form-label fw-bold">
            Especialista
        </label>

        <select class="form-select" name="espec" id="espec">
            <option value="0"></option>
            <option value="1">Nathan</option>
        </select>
    </div>

    <br>

    <div id="div_table" style="display: none;">
        <table class="table table-striped">
            <th style="width: 15%; text-align: left;">Data</th>
            <th style="width: 45%; text-align: center;">Nome</th>
            <th style="width: 40%; text-align: center;">Médico</th>
        </table>
    </div>

    <div id="div_table_qtd">
        <table class="table table-striped">
            <th style="width: 100%; text-align: center;">Quantidade</th>
        </table>
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3">
        Gerar
    </button>

</form>

                    </div>

                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
