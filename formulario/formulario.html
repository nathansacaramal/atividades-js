
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário para Tabela</title>

    <!-- ESTILOS (CSS) -->
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group-2 {
            margin-bottom: 15px;
            background-color: #28a745;
            width: 5000px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #218838;
        }

        /* Estilização da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cadastro de Aluno</h2>
        <form id="meuFormulario">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite o nome" required >
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="Digite o e-mail">
            </div>

            <div class="form-group">
                <label for="curso">Curso:</label>
                <select id="curso" required>
                    <option value="">Selecione um curso</option>
                    <option value="HTML & CSS">HTML & CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                </select>
            </div>

            <button type="submit">Adicionar à Tabela</button>
        </form>
    </div>

    <!-- TABELA DE RESULTADOS -->
    <div class="container">
        <h2>Lista de Cadastrados</h2>
        <table id="tabelaDados">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Curso</th>
                </tr>
            </thead>
            <tbody>
                <!-- As novas linhas criadas pelo JS entrarão aqui -->
            </tbody>
        </table>
    </div>

    <script>
        const formulario = document.getElementById('meuFormulario');
        const tabelaCorpo = document.querySelector('#tabelaDados tbody');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();

            // 3. Capturando os valores digitados nos inputs
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const curso = document.getElementById('curso').value;

            // 4. Criando um novo elemento de linha (<tr>)
            const novaLinha = document.createElement('tr');

            // 5. Preenchendo o HTML interno da linha com as tags de coluna (<td>)
            novaLinha.innerHTML = `
                <td>${nome}</td>
                <td>${email}</td>
                <td>${curso}</td>
            `;

            // 6. Inserindo a nova linha dentro do corpo da tabela

            tabelaCorpo.appendChild(novaLinha);

            // 7. Limpando os campos do formulário para o próximo cadastro
            formulario.reset();
        });
    </script>
</body>
</html>
