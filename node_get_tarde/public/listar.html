<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>

    
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th, td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        th{
            background:#007BFF;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }
    </style>
</head>
<body>

    <a href="home.html">voltar</a>

<h1>Lista de Produtos</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Data Cadastro</th>
        </tr>
    </thead>

    <tbody id="tabelaProdutos">

    </tbody>
</table>

<script>

// Faz uma requisição HTTP assíncrona para a rota "/produtos" criada no servidor Node.js/Express
fetch("/produtos")

// Converte a resposta recebida do servidor para o formato JSON (transformando os dados em um array de objetos)
.then(res => res.json())

// Executa este bloco após a conversão, recebendo o array de produtos vindo do banco de dados
.then(produtos => {

    // Seleciona o elemento HTML <tbody> pelo seu ID ("tabelaProdutos") onde as linhas serão inseridas
    const tabela = document.getElementById("tabelaProdutos");

    // Percorre cada objeto (produto) dentro da lista de produtos retornada
    produtos.forEach(produto => {

        // Adiciona dinamicamente uma nova linha (tr) e colunas (td) preenchidas com os dados do produto na tabela
        tabela.innerHTML += `
            <tr>
                <td>${produto.id_produto}</td>
                <td>${produto.nome_produto}</td>
                <td>${produto.id_categoria}</td>
                <td>${produto.preco}</td>
                <td>${produto.data_cadastro}</td>
            </tr>
        `;

    });

})

// Captura e lida com qualquer erro que ocorra durante o processo de requisição ou conversão
.catch(erro => {
    // Exibe o erro detalhado no console do navegador para fins de depuração
    console.log(erro);
    
    // Mostra um alerta amigável na tela informando o usuário sobre a falha
    alert("Erro ao carregar os produtos.");
});

</script>

</body>
</html>
