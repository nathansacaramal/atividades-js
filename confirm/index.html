<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Formulário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="form-container">
    <h2>Criar Conta</h2>
    
    <form id="signup-form" novalidate>
      <!-- Campo Nome -->
      <div class="input-group">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" placeholder="Digite seu nome">
        <span class="error-message"></span>
      </div>

      <!-- Campo E-mail -->
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com">
        <span class="error-message"></span>
      </div>

      <!-- Campo Senha -->
      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Mín. 8 chars, 1 maiúscula, 1 número">
        <span class="error-message"></span>
      </div>

      <!-- Campo Confirmação de Senha -->
      <div class="input-group">
        <label for="confirm-password">Confirmar Senha</label>
        <input type="password" id="confirm-password" placeholder="Repita a senha">
        <span class="error-message"></span>
      </div>

      <!-- Botão de Envio -->
      <button type="submit" id="submit-btn" disabled>Cadastrar</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
